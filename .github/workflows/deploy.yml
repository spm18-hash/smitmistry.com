name: Deploy Astro site

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::867633231794:role/GitHubActions-smitmistry-com
          aws-region: us-east-1

      - name: Deploy static assets
        run: |
          aws s3 sync dist/_astro/ \
            s3://smitmistry.com-867633231794-ap-south-1-an/_astro/ \
            --region ap-south-1 \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy site
        run: |
          aws s3 sync dist/ \
            s3://smitmistry.com-867633231794-ap-south-1-an/ \
            --region ap-south-1 \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2T0SA8UTH13HE \
            --paths "/*"
